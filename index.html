<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visa Jobs Map Germany</title>
<meta name="description" content="Every open job in Germany on a map: search any city, see which companies are hiring and how many roles they have, filter by level and English-only, and apply.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#00463c;--g2:#e6f5c8;--coral:#ff6f59;--bg:#f6f8f7;--card:#fff;--ink:#10201c;--mut:#5a6b66;--line:#dfe6e3;--chip:#eef3f1}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--card:#131d1a;--ink:#e7efe9;--mut:#9fb1ab;--line:#24332f;--chip:#1a2724}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
a{color:inherit}
header{background:var(--g);color:#fff;padding:12px clamp(12px,3vw,28px)}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font:700 20px "Inter Tight",sans-serif;white-space:nowrap}
.modes{display:flex;background:rgba(255,255,255,.13);border-radius:10px;padding:3px}
.modes button{border:0;background:none;color:#fff;padding:7px 12px;border-radius:8px;font:600 14px Inter;cursor:pointer;white-space:nowrap}
.modes button[aria-pressed=true]{background:#fff;color:var(--g)}
.stats{color:var(--g2);font-size:13px;flex:1 1 200px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
input[type=search],input[type=text],select{height:40px;border-radius:10px;border:0;padding:0 12px;font:inherit;font-size:16px;background:#fff;color:#10201c}
#q{flex:1 1 240px;max-width:380px}#where{width:180px}#radius{width:110px}#city{max-width:230px}
.go{height:40px;border:0;border-radius:10px;background:var(--coral);color:#fff;font:600 15px Inter;padding:0 16px;cursor:pointer}
.seg{display:flex;background:rgba(255,255,255,.13);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;color:#fff;padding:7px 11px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--g2);color:var(--g);font-weight:600}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:#fff;cursor:pointer;white-space:nowrap}
.tog input{width:18px;height:18px;accent-color:var(--coral)}
.only-live,.only-list{display:contents}
body[data-mode=list] .only-live,body[data-mode=live] .only-list{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px clamp(12px,3vw,28px);background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip b{font-weight:600}.chip[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
main{flex:1;display:grid;grid-template-columns:minmax(340px,480px) minmax(0,1fr);min-height:0}
#listWrap{overflow-y:auto;padding:14px;border-right:1px solid var(--line)}
#map{height:100%;min-height:420px}
.sum{font-size:13px;color:var(--mut);margin:0 2px 10px}
.warn{color:#b3261e}
.co{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.co.hi{outline:2px solid var(--coral)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font:700 16px/1.3 "Inter Tight",sans-serif;margin:0}
.n{font:700 22px/1 "Inter Tight",sans-serif;color:var(--g);text-align:right;white-space:nowrap}
@media(prefers-color-scheme:dark){.n{color:#b9e88a}}
.n small{display:block;font:500 11px Inter;color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--g2);color:var(--g);margin:4px 4px 0 0}
.badge.src{background:var(--chip);color:var(--mut);border:1px solid var(--line)}
.badge.vm{background:#ffe2dc;color:#8a2b1c}.badge.en{background:#dbeafe;color:#1e3a8a}.badge.de{background:#eceff1;color:#455a64}
.meta{font-size:13px;color:var(--mut);margin-top:3px}
.offer{font-size:13px;margin:6px 0 0}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.jobs{list-style:none;margin:10px 0 0;padding:0}
.jobs li{border-top:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.jobs .t{font-weight:500}.jobs .s{font-size:12px;color:var(--mut)}
.links{display:flex;flex-direction:column;gap:4px;flex:none}
.apply{font-size:13px;font-weight:600;color:var(--g);text-decoration:none;border:1px solid var(--g);border-radius:8px;padding:5px 10px;text-align:center}
@media(prefers-color-scheme:dark){.apply{color:#b9e88a;border-color:#b9e88a}}
.more{width:100%;margin:6px 0 20px}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
.tabs{display:none}
.leaflet-popup-content{font:14px/1.4 Inter,sans-serif;margin:12px 14px}
.leaflet-popup-content b{font-family:"Inter Tight",sans-serif;font-size:15px}
.pop button{margin-top:8px;border:0;background:#00463c;color:#fff;border-radius:8px;padding:6px 10px;font:600 13px Inter;cursor:pointer}
.legend{background:var(--card);color:var(--ink);padding:8px 10px;border-radius:10px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
footer{font-size:12px;color:var(--mut);padding:8px clamp(12px,3vw,28px);border-top:1px solid var(--line);background:var(--card)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
@media(max-width:860px){
  html,body{height:auto}body{display:block}.stats{flex-basis:100%;order:3;font-size:12px}
  main{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;height:38px}
  body[data-view=list] #mapWrap{display:none} body[data-view=map] #listWrap{display:none}
  #listWrap{border:0;overflow:visible}#map{height:72vh}#where,#q{flex:1 1 100%;max-width:none;width:auto}
}
</style>
<script src="config.js"></script>
</head>
<body data-view="list" data-mode="live">
<header>
  <div class="top">
    <div class="brand">Visa Jobs Map · Germany</div>
    <div class="modes" role="group" aria-label="What to search">
      <button type="button" data-m="live" aria-pressed="true">All employers in Germany</button>
      <button type="button" data-m="list" aria-pressed="false">Careers pages &amp; Arbeitnow</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <form class="filters" id="form">
    <span class="only-live">
      <input type="text" id="where" list="places" placeholder="City or postcode" aria-label="City or postcode" value="Berlin"><datalist id="places"></datalist>
      <select id="radius" aria-label="Distance"><option value="5">+5 km</option><option value="10">+10 km</option><option value="25" selected>+25 km</option><option value="50">+50 km</option><option value="100">+100 km</option></select>
    </span>
    <span class="only-list"><select id="city" aria-label="City"><option value="">All of Germany</option></select></span>
    <input type="search" id="q" placeholder="Job title or skill, e.g. data analyst" aria-label="Job title or skill">
    <span class="only-live"><button class="go" type="submit">Search</button></span>
    <div class="seg" id="lvl" role="group" aria-label="Experience level">
      <button type="button" data-v="all" aria-pressed="true">All levels</button>
      <button type="button" data-v="entry" aria-pressed="false">Entry-level</button>
      <button type="button" data-v="intern" aria-pressed="false">Internships &amp; trainee</button>
      <button type="button" data-v="exp" aria-pressed="false">Experienced</button>
    </div>
    <label class="tog"><input type="checkbox" id="en"> English-only jobs</label>
    <label class="tog"><input type="checkbox" id="visa"> Visa-friendly companies only</label>
    <span class="only-live"><label class="tog"><input type="checkbox" id="noag" checked> Hide temp &amp; recruitment agencies</label></span>
    <span class="only-list"><label class="tog"><input type="checkbox" id="vm"> Job ad mentions visa / relocation</label></span>
  </form>
</header>
<nav class="chips" id="chips" aria-label="Places"></nav>
<div class="tabs"><button class="btn p" data-t="list" type="button">List</button><button class="btn" data-t="map" type="button">Map</button></div>
<main>
  <section id="listWrap" aria-label="Companies"><p class="sum" id="sum"></p><div id="list"></div></section>
  <section id="mapWrap"><div id="map"></div></section>
</main>
<footer id="foot"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe = u => /^https:\/\//.test(u || '') ? u : '';
const API = (window.JOBS_API || '').replace(/\/$/, '');
const LV = {entry:'Entry-level', intern:'Internship / student', mid:'Mid-level', senior:'Senior'};
const BIG = ['Berlin','Munich','Hamburg','Frankfurt am Main','Cologne','Düsseldorf','Stuttgart','Leipzig','Dresden','Hanover','Nuremberg','Bremen','Essen','Dortmund','Bonn','Mannheim','Karlsruhe','Heidelberg','Freiburg','Augsburg','Wiesbaden','Mainz','Münster','Aachen','Potsdam','Kiel','Regensburg','Ingolstadt','Ulm','Darmstadt','Erlangen','Jena','Chemnitz','Braunschweig','Wolfsburg','Bielefeld','Rostock','Würzburg','Magdeburg','Erfurt','Saarbrücken','Lübeck','Osnabrück','Oldenburg','Kassel','Göttingen','Heilbronn','Halle (Saale)'];
const DE_NAME = {'Munich':'München','Cologne':'Köln','Hanover':'Hannover','Nuremberg':'Nürnberg'};
const st = {mode:'live', city:'', lvl:'all', q:'', en:false, visa:false, vm:false, open:null, shown:40,
            where:'Berlin', radius:'25', noag:true};
let DATA = null, map, layer, cityCount = {};

// ---------- language & level helpers (same rules as the daily robot)
const DE_REQ = /(fluent|fluency|business[- ]fluent|native|excellent|very good|strong|good|proficien\w*|professional|full)\W+(?:\w+\W+){0,3}?(german|deutsch)|(german|deutsch)\W*(language\W*)?(skills?\W*)?(\(|:|-)?\W*(c1|c2|b2|native|fluent|mother tongue|muttersprach\w*)|german\W+(is\W+)?(required|mandatory|a must|essential)|(german|deutsch)\w*\W+(?:\w+\W+){0,2}?(speaking|speaker)|(sehr gute|gute|fließende|fliessende|verhandlungssichere|exzellente)\W+(?:\w+\W+){0,2}?deutsch\w*|deutsch\w*\W+(?:\w+\W+){0,2}?(in wort und schrift|fließend|fliessend|verhandlungssicher)/gi;
const DE_SOFT = /(plus|nice[- ]to[- ]have|advantage|advantageous|bonus|not required|not a must|no german|not necessary|optional|helpful|beneficial|desirable|preferred|asset|von vorteil|wünschenswert|willingness to learn|learn german|german classes|german courses|language course)/i;
const DEW = /\b(und|der|die|das|mit|für|wir|sie|ihre|unser|unsere|sowie|eine|einen|bei|deine|dich|bist|kenntnisse|aufgaben|zur|zum|im|als|oder|von)\b/gi;
const ENW = /\b(and|the|with|for|we|you|our|your|are|will|team|experience|skills|of|to|in|as|or)\b/gi;
function textLang(t) {
  t = t || ''; let m; DE_REQ.lastIndex = 0;
  while ((m = DE_REQ.exec(t))) { if (!DE_SOFT.test(t.slice(Math.max(0, m.index - 80), m.index + m[0].length + 80))) return 'de'; }
  const de = (t.match(DEW) || []).length, en = (t.match(ENW) || []).length;
  return de + en >= 6 ? (de > en ? 'de' : 'en') : '';
}
const DE_TITLE = /(\(m\/w\/d\)|\(w\/m\/d\)|\(m\/w\/x\)|\(m\/f\/d\)\s*für|mitarbeiter|sachbearbeiter|kaufmann|kauffrau|fachkraft|fachmann|leiter|referent|werkstudent|praktikant|ausbildung|berater|entwickler|ingenieur|vertrieb|buchhalter|pflege|helfer|fahrer|verkäufer|monteur|elektriker|erzieher|koch|reinigung|lager|stelle|gesucht|für|und|der|die|im|zur|zum|mit)/i;
const EN_TITLE = /\b(manager|engineer|developer|analyst|specialist|associate|consultant|designer|scientist|lead|head|intern|internship|working student|representative|executive|officer|coordinator|architect|administrator|product|marketing|sales|customer|success|software|data|account|business|operations|finance|people|talent|recruiter|support|research|content|growth|partner|senior|junior|of|and|the|for|with)\b/gi;
function titleLang(t) {
  if (DE_TITLE.test(t)) return 'de';
  return (t.match(EN_TITLE) || []).length >= 2 ? 'en' : '';
}
const ENTRY = /\b(junior|jr|graduate|trainee|apprentice|entry[- ]level|einsteiger|berufseinsteiger|associate|quereinsteiger)\b/i;
const INTERN = /\b(intern|internship|praktikum|praktikant\w*|werkstudent\w*|working student|student|thesis|abschlussarbeit)\b/i;
const SENIOR = /\b(senior|sr|lead|principal|staff|head|director|vp|chief|leiter\w*|manager|architect|expert)\b/i;
const levelOf = t => INTERN.test(t) ? 'intern' : ENTRY.test(t) ? 'entry' : SENIOR.test(t) ? 'senior' : 'mid';

// visa-list matching for live results
const normCo = s => (s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/\(.*?\)/g, '').replace(/\b(gmbh|ag|se|kg|co|ug|mbh|inc|ltd|group|deutschland|germany|holding|e\.?v\.?)\b/g, '').replace(/[^a-z0-9]/g, '');
let VISA_KEYS = [];
const visaMatch = name => { const n = normCo(name); return VISA_KEYS.find(v => v.k.length > 3 && (n === v.k || n.startsWith(v.k))); };

// ---------- URL state
function readUrl() {
  const p = new URLSearchParams(location.search);
  st.mode = p.get('mode') === 'list' ? 'list' : 'live';
  st.city = p.get('city') || ''; st.lvl = p.get('level') || 'all'; st.q = p.get('q') || '';
  st.en = p.get('english') === '1'; st.visa = p.get('visa') === '1'; st.vm = p.get('mentions') === '1';
  st.where = p.get('where') || 'Berlin'; st.radius = p.get('km') || '25'; st.noag = p.get('agencies') !== '1';
}
function writeUrl() {
  const p = new URLSearchParams();
  if (st.mode === 'list') { p.set('mode', 'list'); if (st.city) p.set('city', st.city); if (st.vm) p.set('mentions', '1'); }
  else { p.set('where', st.where); if (st.radius !== '25') p.set('km', st.radius); if (!st.noag) p.set('agencies', '1'); }
  if (st.lvl !== 'all') p.set('level', st.lvl); if (st.q) p.set('q', st.q);
  if (st.en) p.set('english', '1'); if (st.visa) p.set('visa', '1');
  history.replaceState(null, '', location.pathname + '?' + p);
}
function syncControls() {
  document.body.dataset.mode = st.mode;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === st.mode));
  document.querySelectorAll('#lvl button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === st.lvl));
  $('q').value = st.q; $('en').checked = st.en; $('visa').checked = st.visa; $('vm').checked = st.vm;
  $('where').value = st.where; $('radius').value = st.radius; $('noag').checked = st.noag;
  $('foot').innerHTML = (st.mode === 'live'
    ? 'Jobs from the Federal Employment Agency (live), company careers pages and <a href="https://www.arbeitnow.com" target="_blank" rel="noopener">Arbeitnow</a> (daily), merged by employer. "English-only" reads job titles and ad texts. "Visa-friendly" marks employers that advertise visa or relocation support: always confirm in the ad.'
    : 'Jobs from company careers pages and <a href="https://www.arbeitnow.com" target="_blank" rel="noopener">Arbeitnow</a>, updated daily. Pins show the city, not the exact office. "Visa-friendly" means the company has advertised visa or relocation support; always confirm in the job ad.');
}

// ---------- map
function initMap() {
  if (!window.L) return;
  map = L.map('map').setView([51.2, 10.4], 6);
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? 'dark_all' : 'light_all'}/{z}/{x}/{y}{r}.png`, {maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
  layer = L.layerGroup().addTo(map);
  const lg = L.control({position: 'bottomleft'});
  lg.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); d.innerHTML = '<span class="dot" style="background:#00463c"></span>Visa / relocation support<br><span class="dot" style="background:#6b7c77"></span>Other employers'; return d; };
  lg.addTo(map);
}
function pin(lat, lng, n, max, visa, name, place, onOpen) {
  const m = L.circleMarker([lat, lng], {radius: 5 + 13 * Math.sqrt(n / max), color: '#fff', weight: 1.5, fillOpacity: .85, fillColor: visa ? '#00463c' : '#6b7c77'});
  const div = document.createElement('div'); div.className = 'pop';
  const b = document.createElement('b'); b.textContent = name; div.append(b);
  const p = document.createElement('div'); p.textContent = `${n} open role${n > 1 ? 's' : ''}${place ? ' in ' + place : ''}${visa ? ' · visa/relocation support' : ''}`; div.append(p);
  const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'View roles'; btn.onclick = onOpen; div.append(btn);
  m.bindPopup(div); m.bindTooltip(`${name} · ${n}`); layer.addLayer(m); return m;
}
function tabs() { document.querySelectorAll('.tabs button').forEach(b => b.className = 'btn' + (b.dataset.t === document.body.dataset.view ? ' p' : '')); if (map) setTimeout(() => map.invalidateSize(), 50); }
function showCard(id) { document.body.dataset.view = 'list'; tabs(); $(id)?.scrollIntoView({behavior: 'smooth', block: 'start'}); }

// =====================================================================  LIVE MODE
// Merges three sources for the searched place: the Federal Employment Agency (live),
// plus the daily robot's jobs from company careers pages and Arbeitnow (data/jobs.json).
const live = {total: 0, facet: [], jobs: [], pages: 0, loading: false, err: '', emp: {}, details: {}, key: '', center: null};
const LVL_PARAMS = {all: {}, entry: {angebotsart: '1', quereinstieg: 'true'}, intern: {angebotsart: '34'}, exp: {angebotsart: '1', quereinstieg: 'false'}};
const SRC = {ba: 'Arbeitsagentur', careers: 'Careers page', arbeitnow: 'Arbeitnow'};
function liveParams(extra) {
  const wo = DE_NAME[st.where] || st.where;
  const p = new URLSearchParams({wo, umkreis: st.radius, ...LVL_PARAMS[st.lvl], ...extra});
  if (st.q) p.set('was', st.q);
  if (st.noag) { p.set('zeitarbeit', 'false'); p.set('pav', 'false'); }
  return p;
}
async function api(path, params) {
  const r = await fetch(`${API}/${path}?${params}`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function slim(j) {
  const loc = (j.stellenlokationen || [])[0] || {}; const t = j.stellenangebotsTitel || j.titel || '';
  return {t, co: j.firma || j.arbeitgeber || 'Unknown employer', ref: j.referenznummer || j.refnr || '', place: loc.adresse?.ort || '',
          lat: loc.breite, lng: loc.laenge, date: j.datumErsteVeroeffentlichung || '', ho: !!j.homeofficemoeglich,
          lang: titleLang(t), lv: levelOf(t), src: 'ba'};
}
let fitLive = false;
async function liveSearch() {
  if (!API) { live.err = 'setup'; renderLive(); return; }
  const key = liveParams({}).toString();
  Object.assign(live, {key, loading: true, err: '', jobs: [], facet: [], pages: 0, emp: {}, total: 0, center: null}); st.open = null; st.shown = 40;
  renderLive();
  try {
    const d = await api('jobs', liveParams({size: '500', page: '1'}));
    if (live.key !== key) return;
    live.total = d.maxErgebnisse || 0;
    const c = d.woOutput?.koordinaten?.[0]; live.center = c ? [c.lat, c.lon] : null;
    live.facet = Object.entries(d.facetten?.arbeitgeber?.counts || {}).sort((a, b) => b[1] - a[1]);
    live.jobs = (d.ergebnisliste || []).map(slim); live.pages = 1;
    if (!live.center && live.jobs.find(j => j.lat)) { const j = live.jobs.find(j => j.lat); live.center = [j.lat, j.lng]; }
    if (st.en && live.total > 500) await loadMore(3);
    fitLive = true;
  } catch (e) { live.err = 'Could not reach the job search right now (' + e.message + '). Try again in a minute.'; }
  live.loading = false; renderLive();
}
async function loadMore(n = 1) {
  const key = live.key;
  for (let i = 0; i < n && live.pages < 20 && live.jobs.length < live.total; i++) {
    const d = await api('jobs', liveParams({size: '500', page: String(live.pages + 1)}));
    if (live.key !== key) return;
    live.jobs = live.jobs.concat((d.ergebnisliste || []).map(slim)); live.pages++;
  }
}
const km = (a, b) => { const r = Math.PI / 180, x = (b[1] - a[1]) * r * Math.cos((a[0] + b[0]) / 2 * r), y = (b[0] - a[0]) * r; return Math.sqrt(x * x + y * y) * 6371; };
// daily jobs (careers pages + Arbeitnow) near the searched place, with the same filters
function dailyNear() {
  if (!DATA || !live.center) return [];
  const R = +st.radius + 10, q = st.q.toLowerCase();
  return DATA.jobs.filter(j => {
    const c = DATA.companies[j.c];
    if (!j.cities.some(city => DATA.cities[city] && km(live.center, DATA.cities[city]) <= R)) return false;
    if (st.lvl !== 'all' && !(st.lvl === 'exp' ? (j.lv === 'mid' || j.lv === 'senior') : j.lv === st.lvl)) return false;
    if (st.en && j.lang !== 'en') return false;
    if (q && !(j.t + ' ' + j.dept + ' ' + c.name).toLowerCase().includes(q)) return false;
    return true;
  });
}
function liveGroups() {
  const by = new Map();
  const get = (key, name) => { if (!by.has(key)) by.set(key, {key, name, baName: '', facet: 0, ba: [], daily: [], ci: null}); return by.get(key); };
  live.jobs.forEach(j => { if (st.en && j.lang !== 'en') return; const g = get(normCo(j.co) || j.co, j.co); g.baName = j.co; g.ba.push(j); });
  if (!st.en) live.facet.forEach(([name, n]) => { const g = get(normCo(name) || name, name); g.baName = name; g.facet = n; });
  dailyNear().forEach(j => {
    const c = DATA.companies[j.c]; const k = normCo(c.name) || c.name;
    const hit = by.has(k) ? k : [...by.keys()].find(x => x.length > 3 && k.length > 3 && (x.startsWith(k) || k.startsWith(x)));
    const g = hit ? by.get(hit) : get(k, c.name); g.daily.push(j); g.ci = j.c; g.name = c.name;
  });
  let g = [...by.values()].map(x => {
    const v = (x.ci !== null && DATA.companies[x.ci].visa) ? {offer: DATA.companies[x.ci].offer} : visaMatch(x.baName || x.name);
    return {...x, count: Math.max(x.facet, x.ba.length) + x.daily.length, visa: v};
  });
  if (st.visa) g = g.filter(x => x.visa);
  return g.sort((a, b) => (!!b.visa - !!a.visa) || b.count - a.count || a.name.localeCompare(b.name));
}
const empId = key => 'emp-' + Array.from(key).reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7).toString(36);
const srcTag = s => `<span class="badge src">${esc(SRC[s] || s)}</span>`;
function baRow(j) {
  const d = live.details[j.ref]; const lang = d?.lang || j.lang;
  const site = d?.site ? (d.site.startsWith('http') ? d.site : 'https://' + d.site) : '';
  return `<li><div><div class="t">${esc(j.t)}</div><div class="s">${esc(j.place)}${j.ho ? ' · home office possible' : ''} · ${esc(LV[j.lv])}${j.date ? ' · ' + esc(j.date) : ''}</div>
    ${srcTag('ba')}${lang === 'en' ? '<span class="badge en">English only</span>' : lang === 'de' ? '<span class="badge de">German required</span>' : ''}</div>
    <div class="links">${j.ref ? `<a class="apply" href="https://www.arbeitsagentur.de/jobsuche/jobdetail/${encodeURIComponent(j.ref)}" target="_blank" rel="noopener">Apply ↗</a>` : ''}
    ${safe(site) ? `<a class="apply" href="${esc(site)}" target="_blank" rel="noopener">Company site ↗</a>` : ''}</div></li>`;
}
function dailyRow(j) {
  return `<li><div><div class="t">${esc(j.t)}</div><div class="s">${esc(j.cities.join(', '))} · ${esc(LV[j.lv])}${j.dept ? ' · ' + esc(j.dept) : ''}${j.date ? ' · ' + esc(j.date) : ''}${j.vm ? ' · <b>mentions visa/relocation</b>' : ''}</div>
    ${srcTag(j.src || 'careers')}${j.lang === 'en' ? '<span class="badge en">English only</span>' : j.lang === 'de' ? '<span class="badge de">German required</span>' : ''}</div>
    <div class="links">${safe(j.url) ? `<a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply ↗</a>` : ''}</div></li>`;
}
function liveCard(x) {
  const id = empId(x.key); const open = st.open === x.key; const e = live.emp[x.key];
  let ba = e && e !== 'loading' && !e.err ? e : x.ba;
  if (st.en) ba = ba.filter(j => (live.details[j.ref]?.lang || j.lang) === 'en');
  const titles = new Set(x.daily.map(j => j.t.toLowerCase()));
  ba = ba.filter(j => !titles.has(j.t.toLowerCase()));
  const places = [...new Set(x.ba.map(j => j.place).concat(x.daily.flatMap(j => j.cities)).filter(Boolean))].slice(0, 4).join(', ');
  const srcs = [...new Set((x.facet || x.ba.length ? ['ba'] : []).concat(x.daily.map(j => j.src || 'careers')))];
  const en = x.ba.filter(j => j.lang === 'en').length + x.daily.filter(j => j.lang === 'en').length;
  const c = x.ci !== null ? DATA.companies[x.ci] : null;
  return `<article class="co${open ? ' hi' : ''}" id="${id}">
    <div class="row"><div><h3 class="name">${esc(x.name)}</h3>
      <div>${x.visa ? '<span class="badge">Visa / relocation support</span>' : ''}${en ? `<span class="badge en">${en} English</span>` : ''}${srcs.map(srcTag).join('')}</div>
      ${places ? `<div class="meta">${esc(places)}</div>` : ''}</div>
      <div class="n">${x.count.toLocaleString()}<small>open roles</small></div></div>
    ${x.visa?.offer ? `<p class="offer">${esc(x.visa.offer)}</p>` : ''}
    <div class="acts"><button class="btn p" data-emp="${esc(x.key)}" type="button">${open ? 'Hide roles' : 'View roles'}</button>
      ${c && safe(c.careers) ? `<a class="btn" href="${esc(c.careers)}" target="_blank" rel="noopener">Careers page ↗</a>` : ''}
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name + ' ' + (x.ba[0]?.place || x.daily[0]?.cities[0] || st.where))}" target="_blank" rel="noopener">Google Maps ↗</a>
      ${x.ba.some(j => j.lat) || x.daily.length ? `<button class="btn" data-flyemp="${esc(x.key)}" type="button">Show on map</button>` : ''}</div>
    ${open ? (e === 'loading' ? '<p class="sum">Loading roles…</p>' : `${e?.err ? `<p class="sum warn">${esc(e.err)}</p>` : ''}${ba.length + x.daily.length ? `<ul class="jobs">${x.daily.map(dailyRow).join('')}${ba.map(baRow).join('')}</ul>` : '<p class="sum">No roles match the English-only filter here.</p>'}`) : ''}
  </article>`;
}
let lastGroups = [];
function renderLive() {
  if (st.mode !== 'live') return;
  writeUrl(); syncControls();
  $('chips').innerHTML = BIG.slice(0, 24).map(c => `<button class="chip" data-w="${esc(c)}" aria-pressed="${st.where === c}">${esc(c)}</button>`).join('');
  if (live.err === 'setup') {
    $('stats').textContent = 'Live search is not set up yet.';
    $('sum').textContent = ''; $('list').innerHTML = '<div class="empty">To search every employer in Germany, add your Cloudflare relay address to <b>config.js</b> (README, part 2). Until then, use the <b>Careers pages &amp; Arbeitnow</b> tab.</div>';
    layer && layer.clearLayers(); return;
  }
  if (live.loading) { $('sum').textContent = `Searching ${st.where}…`; $('list').innerHTML = ''; return; }
  if (live.err) { $('sum').innerHTML = `<span class="warn">${esc(live.err)}</span>`; $('list').innerHTML = ''; return; }
  const g = lastGroups = liveGroups();
  const daily = g.reduce((s, x) => s + x.daily.length, 0);
  $('stats').textContent = `${(live.total + daily).toLocaleString()} open jobs within ${st.radius} km of ${st.where}${st.q ? ' for “' + st.q + '”' : ''} · ${live.total.toLocaleString()} from the Federal Employment Agency, ${daily.toLocaleString()} from careers pages and Arbeitnow`;
  const loaded = live.jobs.length;
  $('sum').innerHTML = `${g.length.toLocaleString()} employers${st.en ? ` with English jobs (agency jobs checked: ${loaded.toLocaleString()} of ${live.total.toLocaleString()})` : ''}${st.visa ? ' on the visa-friendly list' : ''}. ` +
    (!st.en && live.facet.length >= 100 ? 'Load more jobs to find smaller employers.' : '');
  if (!g.length) $('list').innerHTML = `<div class="empty">No employers match. Try a bigger distance or fewer filters.</div>`;
  else $('list').innerHTML = g.slice(0, st.shown).map(liveCard).join('') +
    (g.length > st.shown ? `<button class="btn more" id="more" type="button">Show more employers (${g.length - st.shown} left)</button>` : '') +
    (loaded < live.total && live.pages < 20 ? `<button class="btn more" id="loadjobs" type="button">Load ${Math.min(500, live.total - loaded).toLocaleString()} more agency jobs (${loaded.toLocaleString()} of ${live.total.toLocaleString()} loaded)</button>` : '');
  if (!map) return;
  layer.clearLayers();
  const pins = new Map();
  const add = (key, name, lat, lng, place, n) => { const k = key + '|' + lat.toFixed(3) + ',' + lng.toFixed(3); if (!pins.has(k)) pins.set(k, {key, name, lat, lng, place, n: 0}); pins.get(k).n += n; };
  g.forEach(x => {
    x.ba.forEach(j => j.lat && add(x.key, x.name, j.lat, j.lng, j.place, 1));

  });

async function openEmp(key, scroll) {

    try {
      const d = await api('jobs', liveParams({arbeitgeber: grp.baName, size: '100', page: '1'}));
      live.emp[key] = (d.ergebnisliste || []).map(slim);
      fetchDetails(live.emp[key].slice(0, 30));

async function fetchDetails(jobs) {
  const todo = jobs.filter(j => j.ref && !live.details[j.ref]);
  let i = 0;
  const worker = async () => { while (i < todo.length) { const j = todo[i++];
    try { const d = await api('details', new URLSearchParams({ref: j.ref}));
      live.details[j.ref] = {lang: textLang((d.stellenangebotsTitel || '') + ' ' + (d.stellenangebotsBeschreibung || '')) || j.lang, site: d.allianzpartnerUrl || ''};
    } catch (e) { live.details[j.ref] = {lang: j.lang}; } } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  renderLive();
}

// =====================================================================  LIST MODE (daily data from careers pages)
const lvOk = j => st.lvl === 'all' || (st.lvl === 'exp' ? (j.lv === 'mid' || j.lv === 'senior') : j.lv === st.lvl);
function match(j, ignoreCity) {
  const c = DATA.companies[j.c];
  if (st.visa && !c.visa) return false;
  if (st.vm && !j.vm) return false;
  if (st.en && j.lang !== 'en') return false;
  if (!lvOk(j)) return false;
  if (!ignoreCity && st.city && !j.cities.includes(st.city)) return false;
  if (st.q) { const q = st.q.toLowerCase(); if (!(j.t + ' ' + j.dept + ' ' + c.name).toLowerCase().includes(q)) return false; }
  return true;
}
function groups() {
  const by = new Map();
  DATA.jobs.forEach(j => { if (match(j)) { if (!by.has(j.c)) by.set(j.c, []); by.get(j.c).push(j); } });
  return [...by.entries()].sort((a, b) => (DATA.companies[b[0]].visa - DATA.companies[a[0]].visa) || b[1].length - a[1].length);
}
function card(ci, js) {
  const c = DATA.companies[ci]; const cnt = k => js.filter(j => j.lv === k).length; const open = st.open === ci;
  return `<article class="co${open ? ' hi' : ''}" id="co-${ci}">
    <div class="row"><div><h3 class="name">${esc(c.name)}</h3>
      <div>${c.visa ? '<span class="badge">Visa / relocation support</span>' : ''}${js.some(j => j.vm) ? `<span class="badge vm">${js.filter(j => j.vm).length} ads mention visa</span>` : ''}</div>
      <div class="meta">${esc(c.hq)}${c.sector ? ' · ' + esc(c.sector) : ''}</div></div>
      <div class="n">${js.length}<small>open roles</small></div></div>
    ${c.offer ? `<p class="offer">${esc(c.offer)}</p>` : ''}
    <div class="meta">${js.filter(j => j.lang === 'en').length} English-only · ${cnt('entry')} entry-level · ${cnt('intern')} internship/student · ${cnt('mid') + cnt('senior')} experienced</div>
    <div class="acts"><button class="btn p" data-open="${ci}" type="button">${open ? 'Hide roles' : 'View roles'}</button>
      ${safe(c.careers) ? `<a class="btn" href="${esc(c.careers)}" target="_blank" rel="noopener">Careers page ↗</a>` : ''}
      ${c.pins.length ? `<button class="btn" data-fly="${ci}" type="button">Show on map</button>` : ''}</div>
    ${open ? `<ul class="jobs">${js.map(j => `<li><div><div class="t">${esc(j.t)}</div><div class="s">${esc(j.cities.join(', '))} · ${esc(LV[j.lv])}${j.dept ? ' · ' + esc(j.dept) : ''}${j.date ? ' · ' + esc(j.date) : ''}${j.vm ? ' · <b>mentions visa/relocation</b>' : ''}</div>${srcTag(j.src || 'careers')}${j.lang === 'en' ? '<span class="badge en">English only</span>' : j.lang === 'de' ? '<span class="badge de">German required</span>' : ''}</div><div class="links">${safe(j.url) ? `<a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply ↗</a>` : ''}</div></li>`).join('')}</ul>` : ''}
  </article>`;
}
function renderList(fly) {
  if (st.mode !== 'list') return;
  writeUrl(); syncControls();
  if (!DATA) { $('sum').textContent = 'Loading…'; return; }
  const visaCos = new Set(DATA.jobs.map(j => j.c).filter(c => DATA.companies[c].visa)).size;
  $('stats').textContent = DATA.jobs.length ? `${DATA.jobs.length.toLocaleString()} roles · ${new Set(DATA.jobs.map(j => j.c)).size} companies · ${visaCos} with visa/relocation support · from careers pages and Arbeitnow, updated ${DATA.updated}` : 'No jobs yet. Run the "Update jobs" action on GitHub once (see README).';
  cityCount = {}; DATA.jobs.forEach(j => { if (match(j, true)) j.cities.forEach(c => cityCount[c] = (cityCount[c] || 0) + 1); });
  const cities = Object.keys(cityCount).sort((a, b) => cityCount[b] - cityCount[a]);
  const total = DATA.jobs.filter(j => match(j, true)).length;
  $('chips').innerHTML = `<button class="chip" data-c="" aria-pressed="${!st.city}">All Germany <b>${total.toLocaleString()}</b></button>` +
    cities.map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="${st.city === c}">${esc(c)} <b>${cityCount[c].toLocaleString()}</b></button>`).join('');
  $('city').innerHTML = '<option value="">All of Germany</option>' + cities.slice().sort().map(c => `<option value="${esc(c)}">${esc(c)} (${cityCount[c]})</option>`).join('');

  const g = groups(); const roles = g.reduce((s, x) => s + x[1].length, 0);
  $('sum').textContent = `${roles.toLocaleString()} roles at ${g.length.toLocaleString()} companies${st.city ? ' in ' + st.city : ' in Germany'}`;
  $('list').innerHTML = g.length ? g.slice(0, st.shown).map(([ci, js]) => card(ci, js)).join('') + (g.length > st.shown ? `<button class="btn more" id="more" type="button">Show more companies (${g.length - st.shown} left)</button>` : '')

  }));
  if (fly) { const p = DATA.cities[st.city]; p ? map.flyTo(p, 11, {duration: .6}) : map.flyTo([51.2, 10.4], 6, {duration: .6}); }
}

// =====================================================================  events
const render = fly => st.mode === 'live' ? renderLive() : renderList(fly);
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
  st.mode = b.dataset.m; st.open = null; st.shown = 40;
  if (st.mode === 'live' && !live.jobs.length && !live.loading) liveSearch(); else render(true);
  if (st.mode === 'list' && map) map.flyTo([51.2, 10.4], 6);

$('form').addEventListener('submit', e => { e.preventDefault(); st.where = $('where').value.trim() || 'Berlin'; st.q = $('q').value.trim(); st.radius = $('radius').value; if (st.mode === 'live') liveSearch(); else render(); });
$('q').addEventListener('input', (() => { let t; return () => { if (st.mode !== 'list') return; clearTimeout(t); t = setTimeout(() => { st.q = $('q').value.trim(); st.shown = 40; renderList(); }, 250); }; })());
$('radius').addEventListener('change', () => { st.radius = $('radius').value; liveSearch(); });

$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return;

$('vm').addEventListener('change', () => { st.vm = $('vm').checked; renderList(); });
$('list').addEventListener('click', async e => {
  const em = e.target.closest('[data-emp]'); if (em) return openEmp(em.dataset.emp, false);
  const fe = e.target.closest('[data-flyemp]'); if (fe && map) { const x = lastGroups.find(g => g.key === fe.dataset.flyemp); const j = x?.ba.find(j => j.lat); const p = j ? [j.lat, j.lng] : (x && x.ci !== null ? DATA.companies[x.ci].pins.map(p => [p[1], p[2]])[0] : null); if (p) { document.body.dataset.view = 'map'; tabs(); map.flyTo(p, 13); } return; }

  if (e.target.id === 'more') { st.shown += 40; render(); }
  if (e.target.id === 'loadjobs') { e.target.disabled = true; e.target.textContent = 'Loading…'; try { await loadMore(1); } catch (err) {} renderLive(); }
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { document.body.dataset.view = b.dataset.t; tabs(); }));

$('places').innerHTML = BIG.map(c => `<option value="${esc(c)}">`).join('');
readUrl(); syncControls(); initMap();
fetch('data/jobs.json', {cache: 'no-cache'}).then(r => r.json()).then(d => {
  DATA = d;
  VISA_KEYS = d.companies.filter(c => c.visa).map(c => ({k: normCo(c.name), offer: c.offer, name: c.name}));
  if (st.mode === 'list') renderList(!!st.city); else renderLive();
}).catch(() => { DATA = {companies: [], jobs: [], cities: {}, updated: ''}; if (st.mode === 'list') renderList(); });
if (st.mode === 'live') liveSearch(); else renderList();
}
